<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1070" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7f8c8d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="1070" fill="#fbfcfe"/>

  <!-- vertical trunk lines (behind cards) -->
  <line x1="385" y1="182" x2="385" y2="856" stroke="#c7d2e0" stroke-width="2"/>
  <line x1="1015" y1="182" x2="1015" y2="856" stroke="#e6c3b3" stroke-width="2"/>

  <!-- ===== TOP: the Field ===== -->
  <rect x="545" y="22" width="310" height="74" rx="12" fill="#2c3e50" filter="url(#shadow)"/>
  <text x="700" y="52" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">场 (Field)</text>
  <text x="700" y="78" text-anchor="middle" fill="#d6dde5" font-size="13">看不见的物质,靠对场中物体施力来体现</text>

  <!-- branches to two columns -->
  <path d="M660,96 L470,128" stroke="#7f8c8d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M740,96 L930,128" stroke="#7f8c8d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- column headers -->
  <rect x="235" y="132" width="300" height="50" rx="10" fill="#4285f4" filter="url(#shadow)"/>
  <text x="385" y="163" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">电 场</text>

  <rect x="620" y="140" width="160" height="42" rx="10" fill="#34a853" filter="url(#shadow)"/>
  <text x="700" y="167" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">研究范式</text>

  <rect x="865" y="132" width="300" height="50" rx="10" fill="#e8703a" filter="url(#shadow)"/>
  <text x="1015" y="163" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">磁 场</text>

  <!-- ROW 1: 源  y=210 -->
  <rect x="620" y="228" width="160" height="56" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="700" y="253" text-anchor="middle" fill="#1e7e34" font-size="17" font-weight="700">① 源</text>
  <text x="700" y="273" text-anchor="middle" fill="#1e7e34" font-size="12">场从哪来</text>

  <rect x="170" y="210" width="430" height="92" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="190" y="240" fill="#1a56c4" font-size="16" font-weight="700">静止电荷 → 静电场</text>
  <text x="190" y="266" fill="#333" font-size="14">电荷守恒 · 元电荷 e</text>
  <text x="190" y="289" fill="#333" font-size="14">库仑定律  F = k·q₁q₂ / r²</text>

  <rect x="800" y="210" width="430" height="92" rx="10" fill="#fdecea" stroke="#e8703a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="820" y="240" fill="#c0392b" font-size="16" font-weight="700">运动电荷 / 电流</text>
  <text x="820" y="266" fill="#333" font-size="14">无磁单极</text>
  <text x="820" y="289" fill="#333" font-size="14">方向：安培定则（右手螺旋）</text>

  <!-- ROW 2: 场量  y=320 -->
  <rect x="620" y="338" width="160" height="56" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="700" y="363" text-anchor="middle" fill="#1e7e34" font-size="17" font-weight="700">② 场量</text>
  <text x="700" y="383" text-anchor="middle" fill="#1e7e34" font-size="12">强弱 + 方向</text>

  <rect x="170" y="320" width="430" height="92" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="190" y="350" fill="#1a56c4" font-size="16" font-weight="700">场强 E = F / q（矢量,管"力"）</text>
  <text x="190" y="376" fill="#333" font-size="14">点电荷 E = kQ/r² · 匀强场 E = U/d · 电场线</text>
  <text x="190" y="399" fill="#333" font-size="14">电势 φ、电势差 U（标量,管"能"）· 等势面</text>

  <rect x="800" y="320" width="430" height="92" rx="10" fill="#fdecea" stroke="#e8703a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="820" y="350" fill="#c0392b" font-size="16" font-weight="700">磁感应强度 B = F /(I·L)（矢量）</text>
  <text x="820" y="376" fill="#333" font-size="14">磁感线：闭合曲线,无始无终</text>
  <text x="820" y="399" fill="#333" font-size="14">磁通量 Φ = B·S（标量）</text>

  <!-- ROW 3: 力  y=430 -->
  <rect x="620" y="448" width="160" height="56" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="700" y="473" text-anchor="middle" fill="#1e7e34" font-size="17" font-weight="700">③ 力</text>
  <text x="700" y="493" text-anchor="middle" fill="#1e7e34" font-size="12">场对物体作用</text>

  <rect x="170" y="430" width="430" height="92" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="190" y="463" fill="#1a56c4" font-size="16" font-weight="700">F = qE</text>
  <text x="190" y="492" fill="#333" font-size="14">正电荷沿 E,负电荷逆 E</text>
  <text x="190" y="512" fill="#666" font-size="13">（电荷静止也受力）</text>

  <rect x="800" y="430" width="430" height="92" rx="10" fill="#fdecea" stroke="#e8703a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="820" y="458" fill="#c0392b" font-size="16" font-weight="700">安培力 F = BIL（左手）</text>
  <text x="820" y="484" fill="#333" font-size="14">洛伦兹力 F = qvB（左手,不做功）</text>
  <text x="820" y="507" fill="#666" font-size="13">（须运动且有垂直分量才受力）</text>

  <!-- ROW 4: 运动  y=540 -->
  <rect x="620" y="558" width="160" height="56" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="700" y="583" text-anchor="middle" fill="#1e7e34" font-size="17" font-weight="700">④ 运动</text>
  <text x="700" y="603" text-anchor="middle" fill="#1e7e34" font-size="12">动力学+运动学</text>

  <rect x="170" y="540" width="430" height="92" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="190" y="570" fill="#1a56c4" font-size="16" font-weight="700">类平抛运动</text>
  <text x="190" y="596" fill="#333" font-size="14">垂直入场 → 类平抛</text>
  <text x="190" y="619" fill="#333" font-size="14">沿场方向 → 匀变速直线</text>

  <rect x="800" y="540" width="430" height="92" rx="10" fill="#fdecea" stroke="#e8703a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="820" y="570" fill="#c0392b" font-size="16" font-weight="700">匀速圆周运动（v ⊥ B）</text>
  <text x="820" y="596" fill="#333" font-size="14">qvB = mv²/r  →  r = mv /(qB)</text>
  <text x="820" y="619" fill="#333" font-size="14">T = 2πm /(qB)（周期与 v 无关）</text>

  <!-- ROW 5: 能量  y=650 -->
  <rect x="620" y="668" width="160" height="56" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="700" y="693" text-anchor="middle" fill="#1e7e34" font-size="17" font-weight="700">⑤ 能量</text>
  <text x="700" y="713" text-anchor="middle" fill="#1e7e34" font-size="12">做功与转化</text>

  <rect x="170" y="650" width="430" height="92" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="190" y="680" fill="#1a56c4" font-size="16" font-weight="700">电场力做功 W = qU（保守力）</text>
  <text x="190" y="706" fill="#333" font-size="14">电势能 Eₚ = qφ · 与路径无关</text>
  <text x="190" y="729" fill="#333" font-size="14">加速：qU = ½mv²</text>

  <rect x="800" y="650" width="430" height="92" rx="10" fill="#fdecea" stroke="#e8703a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="820" y="680" fill="#c0392b" font-size="16" font-weight="700">洛伦兹力不做功</text>
  <text x="820" y="706" fill="#333" font-size="14">永远 ⊥ v → 只改方向,不改速率</text>
  <text x="820" y="729" fill="#333" font-size="14">安培力做功 → 电能 / 机械能转化</text>

  <!-- ROW 6: 应用  y=760 -->
  <rect x="620" y="778" width="160" height="56" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="700" y="803" text-anchor="middle" fill="#1e7e34" font-size="17" font-weight="700">⑥ 应用</text>
  <text x="700" y="823" text-anchor="middle" fill="#1e7e34" font-size="12">仪器 / 装置</text>

  <rect x="170" y="760" width="430" height="92" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="190" y="790" fill="#1a56c4" font-size="16" font-weight="700">电容器 C = Q / U</text>
  <text x="190" y="816" fill="#333" font-size="14">平行板 C = εS /(4πkd)</text>
  <text x="190" y="839" fill="#333" font-size="14">动态：接源 U 不变 / 断源 Q 不变</text>

  <rect x="800" y="760" width="430" height="92" rx="10" fill="#fdecea" stroke="#e8703a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="820" y="790" fill="#c0392b" font-size="16" font-weight="700">质谱仪 · 回旋加速器</text>
  <text x="820" y="816" fill="#333" font-size="14">速度选择器（电场力 = 洛伦兹力）</text>
  <text x="820" y="839" fill="#333" font-size="14">磁流体发电</text>

  <!-- ===== BOTTOM: bridge ===== -->
  <path d="M385,856 L520,902" stroke="#8e44ad" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1015,856 L880,902" stroke="#8e44ad" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow)"/>

  <rect x="300" y="905" width="800" height="120" rx="14" fill="#f3e8fd" stroke="#8e44ad" stroke-width="2" filter="url(#shadow)"/>
  <text x="700" y="938" text-anchor="middle" fill="#6c3483" font-size="19" font-weight="700">桥梁：电磁感应（把电与磁统一起来）</text>
  <text x="700" y="967" text-anchor="middle" fill="#333" font-size="14">变化的磁 → 生电：ε = n·ΔΦ/Δt · 动生 ε = BLv · 楞次定律（阻碍变化）· 右手定则</text>
  <text x="700" y="991" text-anchor="middle" fill="#333" font-size="14">变化的电 → 生磁（麦克斯韦思想）</text>
  <text x="700" y="1013" text-anchor="middle" fill="#6c3483" font-size="15" font-weight="700">→ 电磁场 · 电磁波</text>
</svg>
