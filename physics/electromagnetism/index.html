<body>
<a class="skip-link" href="#main">跳到学习内容</a>

<header>
  <a class="brand" href="../../" aria-label="返回知识图谱首页"><span class="brand-mark" aria-hidden="true">k<span>g</span><i></i></span><span>知识图谱<small>物理 / 电磁学</small></span></a>
  <div class="tabs" aria-label="学习视图">
    <button class="tab active" data-view="guided" aria-pressed="true">分层学习</button>

      </div>

        <label for="restore-code">在这台设备恢复笔记</label>
        <input id="restore-code" type="password" placeholder="粘贴以 kg1_ 开头的同步码" autocomplete="off" spellcheck="false" required>
        <button class="toolbtn" type="submit">恢复云端笔记</button>

    </details>
  </section>
  <div id="ann-list"></div>

<script src="data.js"></script>
<script type="module">
import { AnnotationStore } from "../../assets/annotations.js";
(function(){
  const NODES = window.KG_NODES;
  const theme = getComputedStyle(document.documentElement);
  const LAYERS = window.KG_LAYERS.map(layer => ({ ...layer, color: theme.getPropertyValue('--' + layer.id).trim() }));
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  // Panels follow the actual wrapping header at every viewport size.
  new ResizeObserver(([entry]) => {
    document.documentElement.style.setProperty('--header-height', entry.target.offsetHeight + 'px');
  }).observe(document.querySelector('header'));
  const byId = Object.fromEntries(NODES.map(n=>[n.id,n]));
  const layerColor = Object.fromEntries(LAYERS.map(l=>[l.id,l.color]));

  function typeset(el){ if(window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([el]).catch(()=>{}); }

  // ============ view switching ============
  const tabs = document.querySelectorAll('.tab');
  const views = { guided:document.getElementById('view-guided'), graph:document.getElementById('view-graph') };
  let graphInited = false;
  tabs.forEach(t=>t.onclick=()=>{
    tabs.forEach(x=>{ x.classList.remove('active'); x.setAttribute('aria-pressed', 'false'); }); t.classList.add('active'); t.setAttribute('aria-pressed', 'true');
    Object.values(views).forEach(v=>v.classList.remove('active'));
    views[t.dataset.view].classList.add('active');
    if(t.dataset.view==='graph'){
      if(!graphInited){ initGraph(); graphInited=true; }
      else if(!gRAF) loop();
    }
  });

  // ============ guided view ============
  function renderGuided(){
    const el = views.guided;
    let html = `<section class="study-intro"><div><p class="eyebrow">PHYSICS / CHAPTER 01</p><h1>电磁学，<span>从这里连起来。</span></h1><p>从电荷与场出发，理解力、运动与能量。<br>循着分层路径学习，点击知识点，展开公式与推导。</p></div><div class="study-stats"><div><strong>${NODES.length}</strong>个知识点</div><div><strong>${LAYERS.length}</strong>层学习路径</div></div></section>
      <nav class="study-path" aria-label="学习路径">${LAYERS.map((l,i)=>`<a href="#layer-${l.id}"><span>0${i+1}</span>${l.label}</a>`).join('<span aria-hidden="true">→</span>')}</nav>
      <details class="overview"><summary>电磁学六维度总览<span>源 → 场量 → 力 → 运动 → 能量 → 应用</span></summary><img src="assets/overview.svg" width="1400" height="1070" alt="电磁学六维度总览"><p class="ov-cap">研究任何一种场，都可以从同一套范式出发。沿着这张地图，对照电场与磁场的联系。</p></details>
      <p class="search-status" id="search-status" role="status" aria-live="polite"></p>`;
    LAYERS.forEach(layer=>{
      const items = NODES.filter(n=>n.layer===layer.id);
      if(!items.length) return;
      html += `<section class="layer-group" id="layer-${layer.id}">
        <div class="layer-head">
          <h2 class="layer-badge" style="background:${hex(layer.color,.09)};color:${layer.color}">${layer.label}</h2>
          <span class="layer-desc">${layer.desc}</span>
        </div>
        <div class="card-grid">`;
      items.forEach(n=>{
        let tags='';
        if(n.coverage) tags += `<span class="cov ${n.coverage}">${n.coverage==='ok'?'高考主干':'冲满分拓展'}</span>`;
        html += `<div class="mini-card" role="button" tabindex="0" aria-haspopup="dialog" style="--layer-color:${layer.color}" data-id="${n.id}">
          <h3>${n.title}</h3>
          <p>${n.oneLine}</p>
          ${tags}
        </div>`;
      });
      html += `</div></section>`;
    });
    el.innerHTML = html;
    el.querySelectorAll('.mini-card').forEach(c=>{
      c.onclick=()=>openCard(c.dataset.id);
      c.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openCard(c.dataset.id); } };
    });
    typeset(el);
  }

  // ============ concept card drawer ============
  const drawer = document.getElementById('drawer');
  const panelTriggers = new WeakMap();
  function syncPanelAccess(){
    const reading=drawer.classList.contains('open');
    const notes=document.getElementById('ann-panel').classList.contains('open');
    document.querySelector('main').inert=reading || notes;
    drawer.inert=!reading || notes;
  }
  function closePanel(panel){
    panel.classList.remove('open'); panel.inert = true; syncPanelAccess();
    document.getElementById('ann-toolbar').classList.remove('show');
    const trigger=panelTriggers.get(panel);
    if(trigger && trigger.isConnected) trigger.focus();
  }
  function openCard(id){
    const n = byId[id]; if(!n) return;
    if(drawer.classList.contains('open') && document.getElementById('d-body').dataset.nodeId===id){
      closePanel(drawer);
      gNodes.forEach(g=>g._grp&&g._grp.classList.remove('dim'));
      gEdges.forEach(e=>{ if(e._path)e._path.classList.remove('hot'); if(e._lbl)e._lbl.classList.remove('hot'); });
      return;
    }
    if(!drawer.classList.contains('open')) panelTriggers.set(drawer, document.activeElement);
    const lc = layerColor[n.layer];
    const badge = document.getElementById('d-badge');
    const layer = LAYERS.find(l=>l.id===n.layer);
    badge.textContent = layer.label; badge.style.background=hex(lc,.09); badge.style.color=lc;
    const covMap={ok:'高考主干',partial:'冲满分拓展'};
    let tags='';
    if(n.coverage) tags += `<span class="cov ${n.coverage}">${covMap[n.coverage]}</span>`;
    document.getElementById('d-tags').innerHTML = tags;
    document.getElementById('d-title').textContent = n.title;
    document.getElementById('d-oneline').textContent = n.oneLine;
    let body = n.body;
    if(n.edges && n.edges.length){
      body += `<div class="sec-title">关联 / 串联</div><div class="edges-wrap">`;
      n.edges.forEach(e=>{ const t=byId[e.to]; if(t) body += `<button class="edge-chip" data-goto="${e.to}"><span class="etype">${e.type}</span>${t.title}</button>`; });
      body += `</div>`;
    }
    if(n.sources && n.sources.length){
      body += `<div class="sec-title">来源 / 深挖</div><div class="links">`;
      n.sources.forEach(s=> body += `<a href="${s.href}" target="_blank" rel="noopener noreferrer">${s.label}</a>`);
      body += `</div>`;
    }
    const db = document.getElementById('d-body');
    db.innerHTML = body; db.dataset.nodeId = id;
    db.querySelectorAll('.edge-chip').forEach(c=>c.onclick=()=>openCard(c.dataset.goto));
    typeset(db);
    applyAnnotations(id);
    drawer.classList.add('open'); syncPanelAccess(); drawer.scrollTop = 0;
    document.getElementById('drawer-close').focus({preventScroll:true});
  }
  document.getElementById('drawer-close').onclick=()=>closePanel(drawer);

  // ============ force-directed graph (live simulation) ============
  const svg = document.getElementById('graph-svg');
  const SVGNS='http://www.w3.org/2000/svg';
  let gNodes=[], gEdges=[], gView={x:0,y:0,k:1};
  let W=0,H=0, gAlpha=1, gTime=0, gRAF=null, dragN=null, hoverId=null;

  function lighten(h,amt){ const n=parseInt(h.slice(1),16); let r=n>>16&255,g=n>>8&255,b=n&255; r=Math.round(r+(255-r)*amt);g=Math.round(g+(255-g)*amt);b=Math.round(b+(255-b)*amt); return `rgb(${r},${g},${b})`; }

  function initGraph(){
    W=svg.clientWidth; H=svg.clientHeight;
    gNodes = NODES.map((n,i)=>({ id:n.id, node:n,
      r: 10,
      x:W/2+Math.cos(i/NODES.length*6.28)*230+(i*37%80-40),
      y:H/2+Math.sin(i/NODES.length*6.28)*230+(i*53%80-40),
      vx:0, vy:0, ph:i*1.7, ox:0, oy:0 }));
    const pos=Object.fromEntries(gNodes.map(g=>[g.id,g]));
    gEdges=[];
    NODES.forEach(n=>(n.edges||[]).forEach(e=>{ if(pos[e.to]) gEdges.push({s:pos[n.id],t:pos[e.to],type:e.type}); }));
    document.getElementById('graph-legend').innerHTML = LAYERS.map(l=>`<div><span class="sw" style="background:${l.color}"></span>${l.label}</div>`).join('');
    for(let i=0;i<140;i++) physics();
    buildDOM();
    fitGraph();
    enableInteract();
    gAlpha=0.3;
    if(!gRAF) loop();
  }

  function physics(){
    for(let i=0;i<gNodes.length;i++)for(let j=i+1;j<gNodes.length;j++){
      const a=gNodes[i],b=gNodes[j]; let dx=a.x-b.x,dy=a.y-b.y; let d2=dx*dx+dy*dy||1; let d=Math.sqrt(d2);
      let f=22000/d2;
      const minD=a.r+b.r+30; if(d<minD) f+=(minD-d)*0.85;
      dx/=d;dy/=d; a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f;
    }
    gEdges.forEach(e=>{ let dx=e.t.x-e.s.x,dy=e.t.y-e.s.y; let d=Math.sqrt(dx*dx+dy*dy)||1; let f=(d-118)*0.028; dx/=d;dy/=d; e.s.vx+=dx*f;e.s.vy+=dy*f;e.t.vx-=dx*f;e.t.vy-=dy*f; });
    gNodes.forEach(n=>{
      if(n===dragN){ n.vx=0;n.vy=0; return; }
      n.vx+=(W/2-n.x)*0.0035; n.vy+=(H/2-n.y)*0.0035;
      n.vx*=0.82; n.vy*=0.82;
      n.x+=n.vx*0.55; n.y+=n.vy*0.55;
    });
  }

  function loop(){
    if(!views.graph.classList.contains('active')){ gRAF=null; return; }
    gTime+=0.016;
    if(gAlpha>0.004 || dragN){ physics(); gAlpha = dragN?Math.max(gAlpha,0.28):gAlpha*0.985; }
    render();
    gRAF = !reducedMotion.matches || gAlpha>0.004 || dragN ? requestAnimationFrame(loop) : null;
  }

  function render(){
    gNodes.forEach(n=>{ const a = n===dragN || reducedMotion.matches?0:3; n.ox=n.x+Math.sin(gTime*0.7+n.ph)*a; n.oy=n.y+Math.cos(gTime*0.62+n.ph)*a; });
    gEdges.forEach(e=>{
      const x1=e.s.ox,y1=e.s.oy,x2=e.t.ox,y2=e.t.oy;
      const mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1;
      const cx=mx-dy*0.12, cy=my+dx*0.12;
      e._path.setAttribute('d',`M${x1.toFixed(1)},${y1.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`);
      e._lbl.setAttribute('x',cx); e._lbl.setAttribute('y',cy);
    });
    gNodes.forEach(n=>{ n._grp.setAttribute('transform',`translate(${n.ox.toFixed(1)},${n.oy.toFixed(1)})`); });
  }

  function buildDOM(){
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    const defs=document.createElementNS(SVGNS,'defs');
    LAYERS.forEach(l=>{
      const rg=document.createElementNS(SVGNS,'radialGradient'); rg.id='grad-'+l.id;
      rg.setAttribute('cx','35%');rg.setAttribute('cy','28%');rg.setAttribute('r','75%');
      const s1=document.createElementNS(SVGNS,'stop'); s1.setAttribute('offset','0%'); s1.setAttribute('stop-color',lighten(l.color,.6));
      const s2=document.createElementNS(SVGNS,'stop'); s2.setAttribute('offset','60%'); s2.setAttribute('stop-color',l.color);
      const s3=document.createElementNS(SVGNS,'stop'); s3.setAttribute('offset','100%'); s3.setAttribute('stop-color',l.color); s3.setAttribute('stop-opacity','.85');
      rg.appendChild(s1);rg.appendChild(s2);rg.appendChild(s3); defs.appendChild(rg);
    });
    const flt=document.createElementNS(SVGNS,'filter'); flt.id='nodeGlow';
    flt.setAttribute('x','-70%');flt.setAttribute('y','-70%');flt.setAttribute('width','240%');flt.setAttribute('height','240%');
    const blur=document.createElementNS(SVGNS,'feGaussianBlur'); blur.setAttribute('in','SourceGraphic'); blur.setAttribute('stdDeviation','3.2'); blur.setAttribute('result','b');
    const merge=document.createElementNS(SVGNS,'feMerge');
    const m1=document.createElementNS(SVGNS,'feMergeNode');m1.setAttribute('in','b');
    const m2=document.createElementNS(SVGNS,'feMergeNode');m2.setAttribute('in','SourceGraphic');
    merge.appendChild(m1);merge.appendChild(m2); flt.appendChild(blur);flt.appendChild(merge); defs.appendChild(flt);
    svg.appendChild(defs);

    const root=document.createElementNS(SVGNS,'g'); root.id='g-root'; svg.appendChild(root);
    const eLayer=document.createElementNS(SVGNS,'g'); root.appendChild(eLayer);
    const nLayer=document.createElementNS(SVGNS,'g'); root.appendChild(nLayer);
    gEdges.forEach(e=>{
      const p=document.createElementNS(SVGNS,'path'); p.setAttribute('class','g-edge'); e._path=p; eLayer.appendChild(p);
      const lbl=document.createElementNS(SVGNS,'text'); lbl.setAttribute('class','g-edge-label'); lbl.textContent=e.type; e._lbl=lbl; eLayer.appendChild(lbl);
    });
    gNodes.forEach(g=>{
      const grp=document.createElementNS(SVGNS,'g'); grp.setAttribute('class','g-node'); grp.setAttribute('tabindex','0'); grp.setAttribute('role','button'); grp.setAttribute('aria-label',g.node.title);
      grp.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); highlightNeighbors(g.id); openCard(g.id); } });
      const col=layerColor[g.node.layer]; const r=g.r;
      const shape=document.createElementNS(SVGNS,'circle'); shape.setAttribute('r',r);
      shape.setAttribute('fill','url(#grad-'+g.node.layer+')'); shape.setAttribute('stroke',lighten(col,.25)); shape.setAttribute('stroke-width',1.3);
      // Crisp nodes remain legible on the paper background.
      const hit=document.createElementNS(SVGNS,'circle'); hit.setAttribute('r','22'); hit.setAttribute('fill','transparent'); grp.appendChild(hit);
      grp.appendChild(shape);
      if(g.node.coverage==='partial'){
        const b=document.createElementNS(SVGNS,'circle'); b.setAttribute('cx',r-1);b.setAttribute('cy',-r+1);b.setAttribute('r',3.6);
        b.setAttribute('fill','#fbbf24'); b.setAttribute('stroke','#fff');b.setAttribute('stroke-width',1); grp.appendChild(b);
      }
      const t=document.createElementNS(SVGNS,'text'); t.setAttribute('x',r+6); t.setAttribute('y',3.5); t.textContent=shortTitle(g.node.title); grp.appendChild(t);
      g._grp=grp; nLayer.appendChild(grp);
    });
    applyTransform();
  }

  function highlightNeighbors(id){
    const nb=new Set([id]); gEdges.forEach(e=>{ if(e.s.id===id)nb.add(e.t.id); if(e.t.id===id)nb.add(e.s.id); });
    gNodes.forEach(g=>g._grp.classList.toggle('dim',!nb.has(g.id)));
    gEdges.forEach(e=>{ const hot=e.s.id===id||e.t.id===id; e._path.classList.toggle('hot',hot); e._lbl.classList.toggle('hot',hot); });
  }
  function clearHighlight(){ gNodes.forEach(g=>g._grp&&g._grp.classList.remove('dim')); gEdges.forEach(e=>{ e._path&&e._path.classList.remove('hot'); e._lbl&&e._lbl.classList.remove('hot'); }); }

  function screenToGraph(cx,cy){ const rc=svg.getBoundingClientRect(); return { x:(cx-rc.left-gView.x)/gView.k, y:(cy-rc.top-gView.y)/gView.k }; }

  function enableInteract(){
    let mode=null, sx=0, sy=0, moved=0, downNode=null, pointerId=null;
    svg.addEventListener('pointerdown',e=>{
      if(e.button!==0 || mode)return;
      pointerId=e.pointerId;
      svg.setPointerCapture(e.pointerId);
      const ng=e.target.closest('.g-node'); sx=e.clientX; sy=e.clientY; moved=0;
      if(ng){ downNode=gNodes.find(g=>g._grp===ng)||null; dragN=downNode; mode='node'; gAlpha=Math.max(gAlpha,0.5); }
      else { mode='pan'; }
    });
    window.addEventListener('pointermove',e=>{
      if(!mode || e.pointerId!==pointerId)return; const dx=e.clientX-sx, dy=e.clientY-sy; moved+=Math.abs(dx)+Math.abs(dy); sx=e.clientX; sy=e.clientY;
      if(mode==='pan'){ gView.x+=dx; gView.y+=dy; sx=e.clientX;sy=e.clientY; applyTransform(); }
      else if(mode==='node'&&dragN){ const p=screenToGraph(e.clientX,e.clientY); dragN.x=p.x; dragN.y=p.y; gAlpha=Math.max(gAlpha,0.5); if(!gRAF) loop(); }
    });
    window.addEventListener('pointerup',e=>{
      if(e.pointerId!==pointerId)return;
      if(mode==='node'&&moved<5&&downNode){ highlightNeighbors(downNode.id); openCard(downNode.id); }
      else if(mode==='pan'&&moved<5){ clearHighlight(); hoverId=null; }
      dragN=null; mode=null; downNode=null; pointerId=null;
    });
    svg.addEventListener('pointermove',e=>{ if(dragN)return; const ng=e.target.closest('.g-node'); if(ng){ const g=gNodes.find(x=>x._grp===ng); if(g&&g.id!==hoverId){ hoverId=g.id; highlightNeighbors(g.id); } } });
    svg.addEventListener('pointercancel',()=>{ dragN=null; mode=null; downNode=null; pointerId=null; });
    svg.addEventListener('wheel',e=>{ e.preventDefault(); zoomGraph(e.deltaY<0?1.1:.9); },{passive:false});
  }
  function applyTransform(){ const r=document.getElementById('g-root'); if(r) r.setAttribute('transform',`translate(${gView.x},${gView.y}) scale(${gView.k})`); }


  function fitGraph(){
    const xs=gNodes.map(n=>n.x), ys=gNodes.map(n=>n.y);
    const left=Math.min(...xs)-30, right=Math.max(...xs)+130;
    const top=Math.min(...ys)-35, bottom=Math.max(...ys)+45;
    const k=Math.min(1.3, (svg.clientWidth-40)/(right-left), (svg.clientHeight-160)/(bottom-top));
    gView={k:Math.max(.15,k), x:0, y:0};
    gView.x=svg.clientWidth/2-(left+right)/2*gView.k;
    gView.y=(svg.clientHeight-60)/2-(top+bottom)/2*gView.k;
    applyTransform();
  }
  function zoomGraph(factor){
    const old=gView.k, next=Math.max(.15,Math.min(2.6,old*factor));
    const cx=svg.clientWidth/2, cy=svg.clientHeight/2;
    gView.x=cx-(cx-gView.x)*next/old; gView.y=cy-(cy-gView.y)*next/old;
    gView.k=next; applyTransform();
  }
  document.getElementById('zoom-in').onclick=()=>zoomGraph(1.2);
  document.getElementById('zoom-out').onclick=()=>zoomGraph(1/1.2);
  document.getElementById('zoom-reset').onclick=fitGraph;
  new ResizeObserver(()=>{ if(graphInited && svg.clientWidth && svg.clientHeight){ W=svg.clientWidth; H=svg.clientHeight; fitGraph(); } }).observe(svg);

  // ============ annotations ============
  let annotations = [];
  let annotationStore;
  const syncErrors = {
    invalid_code: '同步码格式不正确，请复制完整的同步码。',
    unknown_notebook: '没有找到这本云端笔记，请核对同步码。',
    pending_changes: '当前笔记还有未上传的修改，请先完成同步再切换。',
    state_changed: '笔记刚刚发生变化，请重新恢复。',
    creation_limit: '暂时无法创建更多笔记本，请稍后重试。',
    notebook_full: '笔记本已达到容量上限，请先导出备份。',
    invalid_annotation: '有批注不符合格式或长度要求，请导出备份并删减后重试。',
    body_too_large: '批注过长，请导出备份并删减后重试。'
  };
  function syncError(error){ return syncErrors[error] || '暂时无法连接云端。批注已保留在此设备，联网后会重试。'; }
  function refreshAnnotations(state, status, error){
    const changed=JSON.stringify(annotations)!==JSON.stringify(state.items);
    annotations = state.items;
    updateAnnCount();
    if(changed){
      renderAnnList();
      const cur=document.getElementById('d-body').dataset.nodeId;
      if(cur)applyAnnotations(cur);
    }
    const labels={local:'本地批注', syncing:'正在同步…', pending:'等待同步', synced:'已保存到云端'};
    document.getElementById('sync-status').textContent=labels[status];
    const indicator=document.getElementById('sync-indicator');
    indicator.dataset.status=status; indicator.title=labels[status]; indicator.setAttribute('aria-label',labels[status]);
    document.getElementById('sync-message').textContent=error ? syncError(error) : status==='local' ? '开启后，这台设备已有的批注会一起保存到云端。' : status==='synced' ? '换设备时，用同步码恢复同一本笔记。请先保存同步码。' : `批注已保留在此设备${state.queue.length ? `，还有 ${state.queue.length} 项修改等待上传` : ''}。`;
    document.getElementById('sync-now').textContent=state.token ? '立即同步' : '开启云端同步';
    document.getElementById('sync-now').disabled=status==='syncing';
    document.getElementById('current-code').hidden=!state.token;
    document.getElementById('sync-code').value=state.token || '';
  }
  function localError(){ alert('浏览器无法保存批注。请允许网站存储，或先导出已有批注后再继续。'); }
  function initializeSync(){
    try {
      annotationStore=new AnnotationStore({onChange:refreshAnnotations});
      annotationStore.emit();
      void annotationStore.sync();
    } catch {
      document.getElementById('sync-status').textContent='浏览器存储不可用';
      document.getElementById('sync-message').textContent='请允许网站存储后刷新页面。已有数据不会被覆盖。';
      document.getElementById('sync-now').disabled=true;
      return;
    }
    document.getElementById('sync-now').onclick=()=>{ try { void annotationStore.enable(); } catch { localError(); } };
    document.getElementById('copy-code').onclick=async()=>{
      try { await navigator.clipboard.writeText(annotationStore.read().token); document.getElementById('copy-code').textContent='已复制'; }
      catch { document.getElementById('sync-code').type='text'; document.getElementById('sync-code').select(); document.getElementById('copy-code').textContent='请手动复制'; }
    };
    document.getElementById('show-code').onclick=()=>{
      const field=document.getElementById('sync-code'); field.type=field.type==='password'?'text':'password';
      document.getElementById('show-code').textContent=field.type==='password'?'显示':'隐藏';
    };
    document.getElementById('restore-notebook').onsubmit=async e=>{
      e.preventDefault();
      const code=document.getElementById('restore-code').value.trim();
      const current=annotationStore.read().token;
      if(current && current!==code && !confirm('将切换到另一本云端笔记。当前笔记仍保存在云端，请先保存当前同步码。继续吗？'))return;
      const button=e.target.querySelector('button'); button.disabled=true;
      const message=document.getElementById('restore-message'); message.textContent='正在恢复…';
      try { await annotationStore.restore(code); message.textContent='已恢复云端笔记。'; document.getElementById('restore-code').value=''; }
      catch(error){ message.textContent=syncError(error.message); }
      finally { button.disabled=false; }
    };
    const syncVisible=()=>{ if(document.visibilityState==='visible')void annotationStore.sync(); };
    window.addEventListener('online',syncVisible);
    window.addEventListener('focus',syncVisible);
    window.addEventListener('storage',e=>{ if(e.key==='em-kg-cloud-v1'){ annotationStore.emit(); syncVisible(); } });
    document.addEventListener('visibilitychange',syncVisible);
    setInterval(syncVisible,30000);
  }
  function updateAnnCount(){ document.getElementById('ann-n').textContent=annotations.length; }

  const toolbar=document.getElementById('ann-toolbar');
  let pendingSel=null;
  function updateSelection(){
    const sel=window.getSelection();
    if(!sel.rangeCount || !document.getElementById('d-body').contains(sel.getRangeAt(0).commonAncestorContainer)){ toolbar.classList.remove('show'); return; }
    const txt=sel.toString().trim();
    if(txt.length<2){ toolbar.classList.remove('show'); return; }
    const range=sel.getRangeAt(0); const rect=range.getBoundingClientRect();
    pendingSel={ text:txt, nodeId:document.getElementById('d-body').dataset.nodeId };
    toolbar.style.left=Math.max(8,Math.min(innerWidth-260,rect.left+rect.width/2-110))+'px';
    toolbar.style.top=Math.max(8,rect.top-52)+'px';
    toolbar.classList.add('show');
  }
  document.getElementById('d-body').addEventListener('mouseup',updateSelection);
  document.addEventListener('selectionchange',updateSelection);
  toolbar.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    if(!pendingSel)return; const act=b.dataset.act;
    let note='';
    if(act==='note'||act==='q'){ note=prompt(act==='q'?'你的疑问 / 存疑说明:':'你的批注:'); if(note===null){toolbar.classList.remove('show');return;} }
    if(pendingSel.text.length>4000 || note.length>8000){ alert('选中文字最多 4000 字，批注最多 8000 字。请分段记录。'); return; }
    try { if(!annotationStore)throw new Error('storage_unavailable'); annotationStore.add({nodeId:pendingSel.nodeId, quote:pendingSel.text, kind:act, note}); }
    catch { localError(); return; }
    toolbar.classList.remove('show'); window.getSelection().removeAllRanges();
    applyAnnotations(pendingSel.nodeId); renderAnnList();
  });
  function applyAnnotations(nodeId){
    const body=document.getElementById('d-body');
    body.querySelectorAll('.hl').forEach(s=>{ const p=s.parentNode; p.replaceChild(document.createTextNode(s.textContent),s); p.normalize(); });
    annotations.filter(a=>a.nodeId===nodeId).forEach(a=>highlightText(body,a));
  }
  function highlightText(root,a){
    const walk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    let node; while(node=walk.nextNode()){
      const i=node.nodeValue.indexOf(a.quote);
      if(i>=0){ const range=document.createRange(); range.setStart(node,i); range.setEnd(node,i+a.quote.length);
        const span=document.createElement('span'); span.className='hl'+(a.kind==='q'?' q':''); if(a.note)span.title=a.note;
        try{ range.surroundContents(span); }catch(e){} break; }
    }
  }
  const annPanel=document.getElementById('ann-panel');
  document.getElementById('btn-ann').onclick=()=>{ panelTriggers.set(annPanel, document.activeElement); renderAnnList(); annPanel.inert=false; annPanel.classList.add('open'); syncPanelAccess(); document.getElementById('ann-close').focus(); };
  document.getElementById('ann-close').onclick=()=>closePanel(annPanel);
  function renderAnnList(){
    const list=document.getElementById('ann-list');
    if(!annotations.length){ list.innerHTML='<div class="ann-empty">还没有批注。<br><br>打开任意知识卡片,用鼠标选中一段文字,就会浮出批注工具条。你标的"存疑/提问"可以导出给老师读、并合并回源文档。</div>'; return; }
    list.innerHTML=annotations.slice().reverse().map(a=>{
      const n=byId[a.nodeId]; const kindC=a.kind==='q'?'q':'note';
      return `<div class="ann-item ${kindC}">
        <div class="quote">"${esc(a.quote)}"</div>
        ${a.note?`<div class="txt">${a.kind==='q'?'❓ ':'✏️ '}${esc(a.note)}</div>`:'<div class="txt highlight-label">高亮</div>'}
        <div class="meta"><span>${esc(n?n.title:a.nodeId)}</span><button class="del" data-del="${esc(a.id)}">删除</button></div>
      </div>`;
    }).join('');
    list.querySelectorAll('.del').forEach(d=>d.onclick=()=>{ try { annotationStore.remove(d.dataset.del); } catch { localError(); } });
  }
  document.getElementById('btn-export').onclick=()=>{
    const blob=new Blob([JSON.stringify(annotations,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='em-kg-annotations.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  };

  // ============ search ============
  document.getElementById('search').oninput=e=>{
    const q=e.target.value.toLowerCase().trim();
    views.guided.classList.toggle('searching', Boolean(q));
    let count=0;
    tabs.forEach(x=>{ x.classList.remove('active'); x.setAttribute('aria-pressed','false'); }); document.querySelector('[data-view=guided]').classList.add('active'); document.querySelector('[data-view=guided]').setAttribute('aria-pressed','true');
    Object.values(views).forEach(v=>v.classList.remove('active')); views.guided.classList.add('active');
    views.guided.querySelectorAll('.mini-card').forEach(c=>{
      const n=byId[c.dataset.id]; const hit=!q||(n.title+n.oneLine+n.body).toLowerCase().includes(q);
      c.style.display=hit?'':'none'; if(hit) count++;
    });
    document.getElementById('search-status').textContent=q ? (count ? `找到 ${count} 个相关知识点` : '没有找到相关知识点。试试「电场」「能量」，或清空搜索浏览全部。') : '';
    views.guided.scrollTop=0;
    views.guided.querySelectorAll('.layer-group').forEach(g=>{
      const any=[...g.querySelectorAll('.mini-card')].some(c=>c.style.display!=='none'); g.style.display=any?'':'none';
    });
  };

  // ============ helpers ============
  function hex(c,a){ const n=parseInt(c.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }
  function shortTitle(t){ return t.length>14?t.slice(0,13)+'…':t; }
  function esc(s){ return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  document.addEventListener('keydown',e=>{
    const activePanel = annPanel.classList.contains('open') ? annPanel : drawer.classList.contains('open') ? drawer : null;
    // Keep keyboard navigation within the topmost reading panel.
    if(e.key==='Tab' && activePanel){
      const focusable=[...activePanel.querySelectorAll('button:not(:disabled), a[href], input, summary, [tabindex="0"]')].filter(el=>el.getClientRects().length);
      const first=focusable[0], last=focusable[focusable.length-1];
      if(e.shiftKey && (document.activeElement===first || !activePanel.contains(document.activeElement))){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && (document.activeElement===last || !activePanel.contains(document.activeElement))){ e.preventDefault(); first.focus(); }
    }
    if(e.key==='Escape'){ if(annPanel.classList.contains('open')) closePanel(annPanel); else if(drawer.classList.contains('open')) closePanel(drawer); }
  });

  // init
  renderGuided(); initializeSync(); updateAnnCount();
})();
</script>
